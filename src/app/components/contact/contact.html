<section id="contact" class="contact container">
  <h2 class="contact__title">Contacto</h2>
  <p class="contact__subtitle">
    ¿Interesado en colaborar o tienes alguna pregunta? <br>
    Envíame un mensaje.
  </p>

  <form class="contact__form" action="https://formsubmit.co/leivalihue@gmail.com" method="POST">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <input type="hidden" name="_next" value="https://tu-portfolio.com/gracias.html"> <input type="hidden" name="_subject" value="Nuevo mensaje desde tu Portfolio!">
    <input type="hidden" name="_captcha" value="false"> <button type="submit" class="btn btn--primary">Enviar Mensaje</button>
  </form>
</section>
