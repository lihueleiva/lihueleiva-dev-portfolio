<section id="contact" class="contact container">
  <h2 class="contact__title">Contacto</h2>
  <p class="contact__subtitle">
    ¿Interesado en colaborar o tienes alguna pregunta? <br>
    Envíame un mensaje.
  </p>

  <form class="contact__form" [formGroup]="contactForm" (ngSubmit)="sendEmail()">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" formControlName="name" required>
      <div *ngIf="contactForm.get('name')?.invalid && (contactForm.get('name')?.dirty || contactForm.get('name')?.touched)" class="form-error">
        <small *ngIf="contactForm.get('name')?.hasError('required')">El nombre es requerido.</small>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" required>
      <div *ngIf="contactForm.get('email')?.invalid && (contactForm.get('email')?.dirty || contactForm.get('email')?.touched)" class="form-error">
        <small *ngIf="contactForm.get('email')?.hasError('required')">El email es requerido.</small>
        <small *ngIf="contactForm.get('email')?.hasError('email')">Por favor, introduce un email válido.</small>
      </div>
    </div>
    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea id="message" formControlName="message" rows="5" required></textarea>
      <div *ngIf="contactForm.get('message')?.invalid && (contactForm.get('message')?.dirty || contactForm.get('message')?.touched)" class="form-error">
        <small *ngIf="contactForm.get('message')?.hasError('required')">El mensaje es requerido.</small>
      </div>
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="contactForm.invalid || formStatus === 'Enviando...'">
      {{ formStatus === 'Enviando...' ? 'Enviando...' : 'Enviar Mensaje' }}
    </button>
  </form>

  <div *ngIf="formStatus && formStatus !== 'Enviando...'" class="form-status-alert" [class.form-status-alert--success]="formStatus === '¡Mensaje enviado con éxito!'" [class.form-status-alert--error]="formStatus !== '¡Mensaje enviado con éxito!'">
    <span>{{ formStatus }}</span>
    <button class="close-btn" (click)="closeStatusMessage()">×</button>
  </div>
</section>
