name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: |
          npx ng build --base-href /lihueleiva-dev-portfolio/
          cp dist/lihueleiva-dev-portfolio/browser/index.html dist/lihueleiva-dev-portfolio/browser/404.html
          touch dist/lihueleiva-dev-portfolio/browser/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/lihueleiva-dev-portfolio/browser
